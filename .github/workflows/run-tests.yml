name: Laboratory tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start local application
        run: |
          python server.py > server.log 2>&1 &
          for i in {1..30}; do
            curl --fail http://127.0.0.1:8765/api/health && break
            sleep 1
          done
      - name: Run unit and UI tests
        run: python -m pytest tests/test_unit.py tests/test_login.py tests/test_contact.py tests/test_calculator_ui.py tests/test_todo.py --junitxml=evidence/ci.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            evidence/
            server.log
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test tools
        run: |
          pip install -r requirements.txt
          npm install -g appium@3.9.0
          appium driver install uiautomator2@8.7.3
          mkdir -p evidence
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            appium --log evidence/appium-server.log > evidence/appium-console.log 2>&1 &
            for i in {1..30}; do curl -fsS http://127.0.0.1:4723/status && break; sleep 1; done
            python -m pytest mobile/test_appium.py --junitxml=evidence/mobile.xml -v
      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-evidence
          path: evidence/
