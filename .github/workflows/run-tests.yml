name: Laboratory tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start local application
        run: |
          python server.py > server.log 2>&1 &
          for i in {1..30}; do
            curl --fail http://127.0.0.1:8765/api/health && break
            sleep 1
          done
      - name: Run unit and UI tests
        run: python -m pytest tests/test_unit.py tests/test_login.py tests/test_contact.py tests/test_calculator_ui.py tests/test_todo.py --junitxml=evidence/ci.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            evidence/
            server.log
